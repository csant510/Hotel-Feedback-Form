<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Feedback Form</title>
    
    <!--create h1 title here-->
   <header>
         <h1>Hotel Feedback Form</h1>
    <p>Thank you for staying with us. Please provide feedback on your recent stay.</p>
    </header>
    <!--build out form here-->
    <main>
        <form action="https://hotel-feedback.freecodecamp.org" method="POST">
            <fieldset>
                <legend>Personal Information</legend>
                <!--input data goges below here-->
                <label for="full-name">Name (required):</label>
                <input type="text" id="full-name" name="name" placeholder="e.g., John Doe" required size="20">
                <label for="email">Email address (required):</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required size="20">
                <label for="age">Age (optional):</label>
                <input type="number" id="age" name="age" min="3" max="100" size="20">
            </fieldset>
            <fieldset>
                <legend>Was this your first time at our hotel?</legend>
                <input id="yes-option" type="radio" name="hotel-stay" value="yes">
                <label for="yes-option">Yes</label>
                <input id="no-option" type="radio" name="hotel-stay" value="no">
                <label for="no-option">No</label>
            </fieldset>
            <fieldset>
                <legend>Why did you choose to stay at our hotel? (Check all that apply)</legend>
                <input type="checkbox" id="ads" value="ads" name="choice">
                <label for="ads">Social Media Ads</label>
                <input type="checkbox" id="recommendation"name="choice" value="recommendation"/>
                <label for="recommendation">Personal Recommendation</label>
                <input type="checkbox" id="location" name="choice" value="location"/>
                <label for="location">Location</label>
                <input type="checkbox" id="reputation" name="choice" value="reputation" checked/>
                <label for="reputation">Reputation</label>
                <input type="checkbox" id="price" name="choice" value="price"/>
                <label for="price">Price</label>
            </fieldset>
            <fieldset>
                <legend>Ratings</legend>
                <label for="service">How was the service?</label>
                <select id="service" name="service">
                    <option value="poor">Poor</option>
                    <option value="satisfactory">Satisfactory</option>
                    <option value="good">Good</option>
                    <option value="very-good">Very Good</option>
                    <option value="excellent">Excellent</option>
                    
                </fieldset>
        </form>
    </main>
</head>
<body>
    
</body>
</html>
